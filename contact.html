
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Tahmid Sadbin</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body id="body">

<div id="navbar"></div>

<!-- CONTACT -->

<section class="pt-40 pb-24">

<div class="max-w-6xl mx-auto px-8">

<h1 class="text-5xl font-black mb-6">
Contact Me
</h1>

<p class="text-zinc-400 mb-16">
Let's connect and discuss opportunities, projects and research.
</p>

<div class="grid lg:grid-cols-2 gap-12">

<!-- LEFT -->

<div>
<div class="glass rounded-3xl p-8">

<h2 class="text-2xl font-bold mb-8">
Send a Message
</h2>
<form
action="https://formsubmit.co/sadbin31@gmail.com"
method="POST"
class="space-y-5">

<input
type="hidden"
name="_subject"
value="New Portfolio Contact Message">

<input
type="hidden"
name="_captcha"
value="false">
<input
type="hidden"
name="_template"
value="table">
<input
type="hidden"
name="_next"
value="thankyou.html">

<input
type="text"
name="name"
placeholder="Your Name"
required
class="w-full border border-white/10 rounded-2xl p-4">

<input
type="email"
name="email"
placeholder="Your Email"
required
class="w-full border border-white/10 rounded-2xl p-4">

<textarea
rows="6"
name="message"
placeholder="Your Message"
required
class="w-full border border-white/10 rounded-2xl p-4 text-white">
</textarea>

<button
type="submit"
class="bg-indigo-500 hover:bg-indigo-600 duration-300 px-8 py-4 rounded-full">

Send Message

</button>

</form>

</div>

</div>

<!-- RIGHT -->

<div>

<div class="glass rounded-3xl p-8 mb-6">

<h2 class="text-2xl font-bold mb-4">
Contact Information
</h2>

<p class="text-zinc-400">
📧 sadbin31@gmail.com
</p>

<p class="text-zinc-400 mt-3">
📍 Chattogram, Bangladesh
</p>

</div>

<div class="grid grid-cols-2 gap-6">

<a href="https://github.com/Sadbin663"
target="_blank"
class="social glass rounded-3xl p-8 text-center">

<h3 class="font-bold">
GitHub
</h3>

</a>

<a href="https://www.linkedin.com"
target="_blank"
class="social glass rounded-3xl p-8 text-center">

<h3 class="font-bold">
LinkedIn
</h3>

</a>

<a href="mailto:sadbin31@gmail.com"
class="social glass rounded-3xl p-8 text-center">

<h3 class="font-bold">
Email
</h3>

</a>

<a href="https://wa.me/8801783748724"
target="_blank"
class="social glass rounded-3xl p-8 text-center">

<h3 class="font-bold">
WhatsApp
</h3>

</a>

</div>

</div>

</div>

</div>

</section>

<div id="footer"></div>

<script src="js/navbar.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
